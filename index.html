<!doctype html>
<html lang="th" class="booting">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>เอกภพ</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#04050d">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <!-- the stylesheet arrives with the JS bundle, so the page stays hidden behind this until the app reveals it -->
  <style>
    html, body { background: #020308; }
    body > * { transition: opacity .7s ease; }
    .booting body > :not(#boot) { opacity: 0; pointer-events: none; }
    #boot { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; color: #9b9584; font: 13px system-ui, sans-serif; letter-spacing: .04em; pointer-events: none; }
    html:not(.booting) #boot { opacity: 0; }
    #boot span { animation: boot 1.4s ease-in-out infinite alternate; }
    @keyframes boot { from { opacity: .35; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { body > *, #boot span { transition: none; animation: none; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;700&display=swap">
</head>
<body>
  <div id="boot"><span>กำลังโหลดเอกภพ…</span></div>
  <script>
    // the module script runs too late for the loading text, so pick the language here as well
    try {
      const l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('lang');
      if (l === 'en') {
        document.documentElement.lang = 'en';
        document.querySelector('#boot span').textContent = 'Loading the cosmos…';
      }
    } catch {}
  </script>
  <canvas id="view"></canvas>
  <div id="labels"></div>

  <header class="brand">
    <div class="brand-row"><h1 data-t="title">เอกภพ</h1><select id="lang" class="lang" data-t-label="language" aria-label="ภาษา"></select></div>
    <p data-t="tagline"></p>
    <div class="search" role="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="search" type="search" role="combobox" aria-autocomplete="list" aria-controls="search-list" aria-expanded="false" autocomplete="off" spellcheck="false">
      <kbd id="search-kbd"></kbd>
      <ul id="search-list" role="listbox" hidden></ul>
    </div>
  </header>

  <div class="panel toolbar" role="group" data-t-label="layers" aria-label="ชั้นข้อมูล">
    <label class="chk"><input type="checkbox" data-layer="orbits" checked> <span data-t="orbits">วงโคจร</span></label>
    <label class="chk"><input type="checkbox" data-layer="labels" checked> <span data-t="labels">ชื่อ</span></label>
    <label class="chk" data-t-tip="smallBodiesTip"><input type="checkbox" data-layer="smallBodies" checked> <span data-t="smallBodies">ดาวเคราะห์น้อย</span></label>
    <label class="chk"><input type="checkbox" data-layer="spacecraft" checked> <span data-t="spacecraft">ยานอวกาศ</span></label>
    <label class="chk"><input type="checkbox" data-layer="oort" checked> <span data-t="oort">เมฆออร์ต</span></label>
    <label class="chk" data-t-tip="sdssTip"><input type="checkbox" data-layer="sdss" checked> <span>SDSS</span></label>
    <label class="chk" data-t-tip="desiTip"><input type="checkbox" data-layer="desi" checked> <span>DESI</span></label>
    <label class="chk" data-t-tip="quaiaTip"><input type="checkbox" data-layer="quaia" checked> <span>Quaia</span></label>
    <label class="chk" data-t-tip="trueSizeTip"><input type="checkbox" data-layer="trueSize"> <span data-t="trueSize">ขนาดจริง</span></label>
  </div>

  <aside class="scale">
    <p class="eyebrow" data-t="scale">ระยะซูม</p>
    <ol id="views"></ol>
    <div class="panel scale-foot">
    <p class="cam" id="cam"></p>
    <button type="button" class="chase" id="chase" aria-pressed="false" data-t-tip="chaseTip" hidden><span data-t="chase">หันตามทิศที่ดาวมุ่งไป</span></button>
    <button type="button" class="field-note" id="field-note" hidden><span data-t="fieldNote">ดาวดูหนาแน่นรอบดวงอาทิตย์เพราะข้อมูลไม่ครบ</span> <b data-t="more">อ่านต่อ</b></button>
    </div>
  </aside>

  <section class="panel info" id="info" hidden>
    <button type="button" class="x" id="info-x" data-t-label="close" aria-label="ปิด">×</button>
    <div id="info-body"></div>
  </section>

  <button type="button" class="panel toast" id="toast" hidden></button>
  <div class="ev-tip" id="ev-tip" hidden></div>

  <section class="panel timeline" data-t-label="timeline" aria-label="เส้นเวลา">
    <div class="tl-head">
      <div class="transport">
        <button type="button" class="icon" id="prev-ev" data-t-label="prevEvent" data-t-tip="prevEvent" aria-label="เหตุการณ์ก่อนหน้า">‹</button>
        <button type="button" class="btn" id="play"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg><span data-t="play">เล่น</span></button>
        <button type="button" class="icon" id="next-ev" data-t-label="nextEvent" data-t-tip="nextEvent" aria-label="เหตุการณ์ถัดไป">›</button>
      </div>
      <div class="date"><strong id="d-main"></strong><span id="d-alt"></span></div>
      <label class="chk stop"><input type="checkbox" id="opt-stop"> <span data-t="stopAtEvents">หยุดที่เหตุการณ์สำคัญ</span></label>
      <div class="speed">
        <button type="button" class="icon rev" id="reverse" data-t-label="reverse" data-t-tip="reverse" aria-label="ย้อนเวลา" aria-pressed="false"><svg viewBox="0 0 14 12" aria-hidden="true"><path d="M7 1L1 6l6 5zM13 1L7 6l6 5z" fill="currentColor"/></svg></button>
        <div class="seg" id="speeds" role="group" data-t-label="speed" aria-label="ความเร็ว"></div>
        <button type="button" class="ghost-btn" id="now" data-t="now" data-t-tip="nowTip">ตอนนี้</button>
      </div>
    </div>
    <div class="track" id="track">
      <div class="ev-marks" id="ev-marks"></div>
      <input type="range" id="slider" min="0" max="10000" step="1" data-t-label="dateSlider" aria-label="วันที่">
      <div class="ticks" id="ticks"></div>
    </div>
  </section>

  <section class="panel hole-clock" id="hole-clock" data-t-label="holeClock" aria-label="เวลาที่ใจกลางทางช้างเผือก" hidden>
    <span class="hole-title" data-t="holeClock">เวลาที่ใจกลางทางช้างเผือก</span>
    <button type="button" class="btn"></button>
    <div class="date"><strong></strong><span></span></div>
    <div class="seg" role="group" data-t-label="speed" aria-label="ความเร็ว"></div>
    <button type="button" class="ghost-btn" data-t="now">ตอนนี้</button>
  </section>

  <p class="credits" data-t="credits"></p>
  <div id="data-error" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
