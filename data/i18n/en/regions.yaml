asteroid-belt:
  desc: Millions of asteroids between Mars and Jupiter, together only about 3% of the Moon's mass. Shown are those larger than about 5 km, on their real orbits from the JPL database. The Kirkwood gaps are cleared by resonances with Jupiter.
trojans:
  desc: Two swarms that lead and trail Jupiter by 60°, at its L4 and L5 Lagrange points. The Lucy spacecraft is on its way to them.
kuiper-belt:
  desc: A belt of icy bodies beyond Neptune, home to Pluto, Haumea and Makemake. The crowd at 39.4 AU is in a 2:3 resonance with Neptune, like Pluto. Every dot is a real, discovered object.
heliosphere:
  desc: The bubble of solar wind around the Solar System. Voyager 1 crossed the termination shock at 94 AU in 2004 and the heliopause at 121 AU in 2012, where the solar wind stops and interstellar space begins. The real shape trails out like a comet's tail; it is drawn here as a rough sphere.
oort-cloud:
  desc: A spherical shell of perhaps trillions of icy bodies, the source of long-period comets. No object in the Oort cloud has ever been observed directly, so what you see is a model based on theory. The inner part is a thick disk from about 2,000 to 20,000 AU; the outer part is a sphere reaching about 100,000 AU, or 1.6 light years, nearly halfway to the next star. Voyager 1 will take about 300 years just to reach its inner edge.
star-field:
  desc: About 108,000 stars with measured distances within some 3,000 light years, every one at its real position. From inside the Solar System they are the night sky we see; fly out and the constellations come apart, their stars at very different distances. All of this is a small corner of the Milky Way, which is about 100,000 light years across.
hyades:
  desc: The nearest open cluster, about 153 light years away, the V at the head of Taurus. It is some 600–700 million years old. Aldebaran seems to sit in the middle of it but is much closer (65 light years), just in the same direction; fly round to the side to see it.
coma-cluster:
  desc: The open cluster Melotte 111 in Coma Berenices, about 280 light years away and the second nearest after the Hyades. To the eye it is a faint spray of stars several degrees wide.
pleiades:
  desc: The open cluster M45, about 444 light years away and some 100 million years old, very young next to the Sun (4.6 billion). The eye sees 6 or 7 stars, but it has over a thousand. The blue haze around it is dust reflecting starlight that the cluster happens to be passing through, not the cloud it was born from.
ic2391:
  desc: The open cluster IC 2391 in the southern sky, about 490 light years away and some 50 million years old.
alpha-persei:
  desc: The open cluster Melotte 20 around Mirfak in Perseus, about 570 light years away and some 50–70 million years old.
praesepe:
  desc: The open cluster M44 (Praesepe) in Cancer, about 577 light years away and 600–700 million years old. It is about as old as the Hyades and moves the same way, so the two may have formed from the same cloud. Galileo was the first to see through a telescope that it is dozens of stars.
helix-nebula:
  desc: The planetary nebula NGC 7293, one of the nearest, about 650 light years away. It is the shell of gas a Sun-like star threw off near the end of its life, around what is left of the star, a white dwarf. The Sun will do the same in about 5 billion years. Inside it glows teal from oxygen, and its outer edge red from hydrogen and nitrogen. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs.
orion-nebula:
  desc: The nearest region forming massive stars, about 1,344 light years away. To the eye it is the fuzzy star in Orion's sword. The gas glows from the light of the very hot Trapezium stars at its heart, and hundreds of newborn stars and planet-forming disks lie inside. It is a blister on the face of a big dark cloud behind it, so from the far side there is only dark dust. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs.
horsehead-nebula:
  desc: "A dark pillar of dust, Barnard 33, about 3.5 light years tall, rising out of the dark cloud below it. It shows as a horse's head because it stands in front of IC 434, a sheet of hydrogen glowing red in the light of Sigma Orionis, about 1,375 light years away, close to the Orion Nebula. The blue glow at the lower left is NGC 2023, dust lit by a young star. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
dumbbell-nebula:
  desc: "The planetary nebula M27, the first one found (1764), about 1,360 light years away. The bright 'apple core' in the middle glows teal from oxygen, the gas round it red from hydrogen. The white dwarf at its centre is about 85,000 degrees. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
veil-nebula:
  desc: "The Cygnus Loop, what is left of a star about 20 times the Sun's mass that blew up some 10,000–20,000 years ago, about 2,400 light years away. The shell, over 120 light years across, is still growing. The threads are where we look along its edge, which is why they are brighter than the parts facing us; red from hydrogen and teal from oxygen twine through each other. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
ring-nebula:
  desc: "The planetary nebula M57 in Lyra, about 2,570 light years away. Images from Webb and Hubble show it is really a hollow barrel that we happen to look along almost end on, which is why it looks like a ring. Inside it glows teal from oxygen, its outer edge red from hydrogen and nitrogen. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
cats-eye-nebula:
  desc: "The planetary nebula NGC 6543, about 3,300 light years away. Its core is only about 0.2 light years across but very tangled, with bubbles of gas crossing each other and red knots at their tips. Round it lie faint rings from puffs of gas the star threw off every 1,500 years or so. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
lagoon-nebula:
  desc: "The star-forming region M8 in Sagittarius, about 4,100 light years away and some 110 light years across, a smudge in the Milky Way to the naked eye. It is named for the dark lane of dust across its middle. Near its heart is the bright Hourglass, where very hot stars are blowing the gas away. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
trifid-nebula:
  desc: "M20 in Sagittarius, near the Lagoon, about 4,000–5,000 light years away (its distance is still uncertain). It has three kinds in one: glowing red hydrogen to the south, dust scattering starlight blue to the north, and three dark lanes of dust splitting the red part into three, which gives it its name. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
rosette-nebula:
  desc: "A star-forming region in Monoceros, about 5,200 light years away and some 130 light years across. Its middle is hollow, blown out by the wind and light of the young cluster NGC 2244 inside, leaving a shell of red hydrogen like a rose, with small dark globules of dust scattered through it. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
eagle-nebula:
  desc: "M16 in Serpens, about 5,700 light years away, home of the 'Pillars of Creation' Hubble photographed in 1995: columns of dust about 4 light years tall being eaten away by the light of the cluster NGC 6611, so their edges facing it glow. Stars are forming inside them. In the app the pillars are tiny next to the whole nebula; zoom in close to see them. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
crab-nebula:
  desc: "The supernova remnant M1, about 6,500 light years away, from the star Chinese astronomers recorded blowing up in 1054, bright enough to see by day for over three weeks. At its centre is a pulsar spinning 30 times a second, whose particles make the inside glow bluish white, inside threads of red and yellow gas. The whole thing is about 11 light years across and still growing at some 1,500 km/s. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
carina-nebula:
  desc: "A huge star-forming region in the southern sky, about 7,500 light years away and some 230–300 light years across, several times the size of the Orion Nebula. It holds dozens of very massive stars, among them Eta Carinae, about 100 times the Sun's mass and likely to go supernova some day. A V-shaped lane of dark dust crosses its middle. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
coalsack:
  desc: "The darkest nebula to the naked eye, a black patch in the Milky Way beside the Southern Cross, about 600 light years away. There are no stars in it to light it; it is only dust blocking the stars behind, so in the app it shows best when looking through it at stars or the Milky Way. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; the clumps of dust inside are placed by hand."
milky-way:
  desc: The barred spiral galaxy the Solar System is in, with some 100–400 billion stars. The disk is about 100,000 light years across but only about a thousand thick. The Sun is some 26,700 light years from the centre, in the Orion Arm, and goes round it once every 230 million years or so, only about 20 times since it formed. The pale band across the night sky is this disk seen from inside.
sgr-a:
  desc: The supermassive black hole at the centre of the Galaxy, about 4.3 million times the Sun's mass and 26,700 light years away towards Sagittarius. Dust hides it completely in visible light. Astronomers proved it is there from the orbits of the S-stars around it (the 2020 Nobel Prize in Physics). S2 goes round every 16 years and swings within about 120 AU at nearly 3% of the speed of light. Every star shown here follows its measured orbit, so try speeding up time. The Event Horizon Telescope imaged the ring around its shadow in 2022; it is about 0.4 AU across, smaller than Mercury's orbit.
lmc:
  desc: The largest satellite galaxy of the Milky Way, about 163,000 light years away, a naked-eye smudge in the southern sky. Supernova 1987A, the brightest of modern times, went off in it.
smc:
  desc: A dwarf satellite galaxy of the Milky Way, about 200,000 light years away, pulled out of shape by the gravity of the Milky Way and the Large Magellanic Cloud.
andromeda:
  desc: The largest spiral in the Local Group, about 2.5 million light years away and the farthest thing easily seen with the naked eye, an oval smudge in Andromeda. It has around a trillion stars, several times the Milky Way's, and it is heading toward us. The light you see tonight left it before there were humans.
triangulum:
  desc: The third-largest spiral in the Local Group after Andromeda and the Milky Way, about 2.7 million light years away and probably a satellite of Andromeda. Its loose arms are full of pink star-forming regions. Under a truly dark sky some people can see it with the naked eye.
galaxy-field:
  desc: About 55,000 galaxies with measured distances from the Cosmicflows-4 catalogue (Tully et al. 2023), out to some 2.6 billion light years, and some 31,000 more from the 2MASS Redshift Survey (Huchra et al. 2012), which has every galaxy bright enough over almost the whole sky within about a billion light years, some 99,000 from the 6dF Galaxy Survey (Jones et al. 2009), which fills in the southern sky out to about 2.5 billion, and some 2.4 million from the Sloan Digital Sky Survey, out to about 8.5 billion light years, and 2.4 million galaxies and quasars from DESI (the Dark Energy Spectroscopic Instrument), out to about 20 billion, and some 1.2 million quasars over the whole sky from Quaia (Storey-Fisher et al. 2024). Each point is a whole galaxy of billions of stars. Galaxies are not spread evenly but gather into clusters, sheets and filaments hundreds of millions of light years long, with great voids between. The Milky Way sits on the outskirts of the Virgo Supercluster.
bootes-void:
  desc: A region almost empty of galaxies, about 330 million light years across and some 700 million light years away toward Boötes. Found in 1981 and often called the Great Void, it is one of the largest known. Had the Milky Way sat at its centre, we would not have known other galaxies existed until the 1960s. Most of the universe is voids like this, between walls and filaments of galaxies.
cmb:
  desc: "The oldest light there is to see. It set out when the universe was about 380,000 years old and had cooled enough to let light through for the first time, and has travelled some 13.8 billion years since, stretched into microwaves as the universe grew. The place it left is now about 41 billion light years away The figure usually quoted is 46 billion. The difference is the expansion rate, the Hubble constant H0: every galaxy here is placed with H0 = 75 km/s/Mpc, while the 46 billion uses Planck's 67.7. Nearby galaxies give about 73 and Planck about 67 to 68, and why the two methods disagree is still unexplained. So everything this far out is about 10% closer than Planck's numbers would put it, all together, and the sphere sits where it should relative to the galaxies. Before that the universe was a hot opaque gas, so there is no seeing past it: this sphere is the edge of the observable universe. The map is from the Planck satellite (2018). Red is warmer than average and blue cooler, by only about a part in 100,000 of 2.7 kelvin. Those small differences are the seeds that grew into galaxies and the cosmic web. Between the farthest galaxies here and this sphere is what has not been mapped yet, not empty space. The band along the Milky Way is filled in by estimate, where our Galaxy's dust is in the way."
