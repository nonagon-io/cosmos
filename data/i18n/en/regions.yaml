asteroid-belt:
  desc: Millions of asteroids between Mars and Jupiter, together only about 3% of the Moon's mass. Shown are those larger than about 5 km, on their real orbits from the JPL database. The Kirkwood gaps are cleared by resonances with Jupiter.
trojans:
  desc: Two swarms that lead and trail Jupiter by 60°, at its L4 and L5 Lagrange points. The Lucy spacecraft is on its way to them.
kuiper-belt:
  desc: A belt of icy bodies beyond Neptune, home to Pluto, Haumea and Makemake. The crowd at 39.4 AU is in a 2:3 resonance with Neptune, like Pluto. Every dot is a real, discovered object.
heliosphere:
  desc: The bubble of solar wind around the Solar System. Voyager 1 crossed the termination shock at 94 AU in 2004 and the heliopause at 121 AU in 2012, where the solar wind stops and interstellar space begins. The real shape trails out like a comet's tail; it is drawn here as a rough sphere.
oort-cloud:
  desc: A spherical shell of perhaps trillions of icy bodies, the source of long-period comets. No object in the Oort cloud has ever been observed directly, so what you see is a model based on theory. The inner part is a thick disk from about 2,000 to 20,000 AU; the outer part is a sphere reaching about 100,000 AU, or 1.6 light years, nearly halfway to the next star. Voyager 1 will take about 300 years just to reach its inner edge.
star-field:
  desc: About 108,000 stars with measured distances within some 3,000 light years, every one at its real position. From inside the Solar System they are the night sky we see; fly out and the constellations come apart, their stars at very different distances. All of this is a small corner of the Milky Way, which is about 100,000 light years across.
hyades:
  desc: The nearest open cluster, about 153 light years away, the V at the head of Taurus. It is some 600–700 million years old. Aldebaran seems to sit in the middle of it but is much closer (65 light years), just in the same direction; fly round to the side to see it.
coma-cluster:
  desc: The open cluster Melotte 111 in Coma Berenices, about 280 light years away and the second nearest after the Hyades. To the eye it is a faint spray of stars several degrees wide.
pleiades:
  desc: The open cluster M45, about 444 light years away and some 100 million years old, very young next to the Sun (4.6 billion). The eye sees 6 or 7 stars, but it has over a thousand. The blue haze around it is dust reflecting starlight that the cluster happens to be passing through, not the cloud it was born from.
ic2391:
  desc: The open cluster IC 2391 in the southern sky, about 490 light years away and some 50 million years old.
alpha-persei:
  desc: The open cluster Melotte 20 around Mirfak in Perseus, about 570 light years away and some 50–70 million years old.
praesepe:
  desc: The open cluster M44 (Praesepe) in Cancer, about 577 light years away and 600–700 million years old. It is about as old as the Hyades and moves the same way, so the two may have formed from the same cloud. Galileo was the first to see through a telescope that it is dozens of stars.
helix-nebula:
  desc: The planetary nebula NGC 7293, one of the nearest, about 650 light years away. It is the shell of gas a Sun-like star threw off near the end of its life, around what is left of the star, a white dwarf. The Sun will do the same in about 5 billion years. Inside it glows teal from oxygen, and its outer edge red from hydrogen and nitrogen. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs.
orion-nebula:
  desc: The nearest region forming massive stars, about 1,344 light years away. To the eye it is the fuzzy star in Orion's sword. The gas glows from the light of the very hot Trapezium stars at its heart, and hundreds of newborn stars and planet-forming disks lie inside. It is a blister on the face of a big dark cloud behind it, so from the far side there is only dark dust. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs.
horsehead-nebula:
  desc: "A dark pillar of dust, Barnard 33, about 3.5 light years tall, rising out of the dark cloud below it. It shows as a horse's head because it stands in front of IC 434, a sheet of hydrogen glowing red in the light of Sigma Orionis, about 1,375 light years away, close to the Orion Nebula. The blue glow at the lower left is NGC 2023, dust lit by a young star. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
dumbbell-nebula:
  desc: "The planetary nebula M27, the first one found (1764), about 1,360 light years away. The bright 'apple core' in the middle glows teal from oxygen, the gas round it red from hydrogen. The white dwarf at its centre is about 85,000 degrees. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
veil-nebula:
  desc: "The Cygnus Loop, what is left of a star about 20 times the Sun's mass that blew up some 10,000–20,000 years ago, about 2,400 light years away. The shell, over 120 light years across, is still growing. The threads are where we look along its edge, which is why they are brighter than the parts facing us; red from hydrogen and teal from oxygen twine through each other. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
ring-nebula:
  desc: "The planetary nebula M57 in Lyra, about 2,570 light years away. Images from Webb and Hubble show it is really a hollow barrel that we happen to look along almost end on, which is why it looks like a ring. Inside it glows teal from oxygen, its outer edge red from hydrogen and nitrogen. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
cats-eye-nebula:
  desc: "The planetary nebula NGC 6543, about 3,300 light years away. Its core is only about 0.2 light years across but very tangled, with bubbles of gas crossing each other and red knots at their tips. Round it lie faint rings from puffs of gas the star threw off every 1,500 years or so. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
lagoon-nebula:
  desc: "The star-forming region M8 in Sagittarius, about 4,100 light years away and some 110 light years across, a smudge in the Milky Way to the naked eye. It is named for the dark lane of dust across its middle. Near its heart is the bright Hourglass, where very hot stars are blowing the gas away. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
trifid-nebula:
  desc: "M20 in Sagittarius, near the Lagoon, about 4,000–5,000 light years away (its distance is still uncertain). It has three kinds in one: glowing red hydrogen to the south, dust scattering starlight blue to the north, and three dark lanes of dust splitting the red part into three, which gives it its name. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
rosette-nebula:
  desc: "A star-forming region in Monoceros, about 5,200 light years away and some 130 light years across. Its middle is hollow, blown out by the wind and light of the young cluster NGC 2244 inside, leaving a shell of red hydrogen like a rose, with small dark globules of dust scattered through it. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
eagle-nebula:
  desc: "M16 in Serpens, about 5,700 light years away, home of the 'Pillars of Creation' Hubble photographed in 1995: columns of dust about 4 light years tall being eaten away by the light of the cluster NGC 6611, so their edges facing it glow. Stars are forming inside them. The pillars are tiny next to the whole nebula, so they have their own entry: search for 'Pillars of Creation' to fly in close. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
crab-nebula:
  desc: "The supernova remnant M1, about 6,500 light years away, from the star Chinese astronomers recorded blowing up in 1054, bright enough to see by day for over three weeks. At its centre is a pulsar spinning 30 times a second, whose particles make the inside glow bluish white, inside threads of red and yellow gas. The whole thing is about 11 light years across and still growing at some 1,500 km/s. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
carina-nebula:
  desc: "A huge star-forming region in the southern sky, about 7,500 light years away and some 230–300 light years across, several times the size of the Orion Nebula. It holds dozens of very massive stars, among them Eta Carinae, about 100 times the Sun's mass and likely to go supernova some day. A V-shaped lane of dark dust crosses its middle. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
coalsack:
  desc: "The darkest nebula to the naked eye, a black patch in the Milky Way beside the Southern Cross, about 600 light years away. There are no stars in it to light it; it is only dust blocking the stars behind, so in the app it shows best when looking through it at stars or the Milky Way. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate, and the clumps of dust inside are placed by hand."
southern-ring-nebula:
  desc: "The planetary nebula NGC 3132 in Vela, about 2,000–2,500 light years away and some 0.7 light years across, one of the first pictures Webb released, in 2022. Inside it glows teal from oxygen, its rim orange-red from hydrogen and nitrogen, and faint rings lie round it from the puffs its star gave off one after another. A pair of stars sits in the middle. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
eskimo-nebula:
  desc: "The planetary nebula NGC 2392 in Gemini, about 6,500 light years away by Gaia (older estimates said 3,000–4,000) and some 1.5 light years across. In a small telescope it looks like a face in a fur-lined hood: a bright bubble glowing teal inside, ringed by orange streaks like comet tails blown outward. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
butterfly-nebula:
  desc: "The planetary nebula NGC 6302 in Scorpius, about 3,000–3,800 light years away, its two wings more than 3 light years from tip to tip. The star at its heart is one of the hottest known, about 220,000 degrees, but it is hidden from us by the thick ring of dust round its waist, the same ring that squeezes the gas out into two wings. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
owl-nebula:
  desc: "The planetary nebula M97 in Ursa Major, about 2,000–2,900 light years away and some 2.6 light years across. It is nearly round and glows teal from oxygen, with two dark patches like an owl's eyes, most likely a hollow barrel inside it seen at a slant. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
cone-nebula:
  desc: "The NGC 2264 region in Monoceros, about 2,350–2,700 light years away: hydrogen glowing red in the light of the young cluster round S Monocerotis to the north, the Christmas Tree Cluster, and to the south the Cone, a dark pillar of dust about 7 light years long, thought to point at the stars that are eating it away. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
north-america-nebula:
  desc: "NGC 7000 and the Pelican Nebula (IC 5070) in Cygnus, near Deneb, about 2,600 light years away and some 130 light years across all told. They are one cloud of glowing gas, cut in two by the dark cloud L935 lying in front, which is what gives the outline of North America and of the pelican. The bright edge along its south is the Cygnus Wall. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
heart-nebula:
  desc: "IC 1805 in Cassiopeia, about 6,500–7,500 light years away and some 300 light years across. The wind and light of the massive cluster Melotte 15 in the middle have blown a cavity, leaving a shell of red hydrogen. The bright knot on its western edge is NGC 896. It lies next to the Soul Nebula. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
soul-nebula:
  desc: "IC 1848 in Cassiopeia, beside the Heart, about 6,500–7,500 light years away and some 300 light years across. Two cavities lie side by side east and west, each blown out by its own young cluster, and new stars are still forming on their rims. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
pacman-nebula:
  desc: "NGC 281 in Cassiopeia, about 9,200 light years away by radio parallax and some 90 light years across: pink hydrogen lit by the cluster IC 1590 in its middle, with a lane of dust across it for Pac-Man's mouth, and small dark globules that may be forming stars. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
bubble-nebula:
  desc: "NGC 7635 in Cassiopeia, about 8,800–9,800 light years away: a bubble some 8 light years across blown by the wind of a single hot star, BD+60 2522, about 45 times the Sun's mass. The star is off-centre because one side of the bubble runs into denser gas. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
witch-head-nebula:
  desc: "IC 2118 in Eridanus, about 900–1,000 light years away and some 50 light years long: dust reflecting the light of Rigel, about 2.5 degrees away on the sky, and blue for the same reason the sky is blue. It is very faint and shows only in long exposures. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
rho-ophiuchi:
  desc: "One of the nearest star-forming clouds, about 450 light years away and 35–50 light years across, and among the most colourful sights in the sky, because three stars light the same dust three ways. Round Rho Ophiuchi to the north the dust shines blue, round Antares to the south yellow-orange like the star (Antares is about 100 light years further off), and round Sigma Scorpii to the west the gas glows red. Dark lanes trail away east. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
cassiopeia-a:
  desc: "The youngest known supernova remnant in our Galaxy, about 11,000 light years away and some 16 light years across. Light from the blast would have reached us around 1680, but hardly anyone noted it, as dust along the way dimmed it. In visible light it is a broken shell of threads of oxygen, sulphur and hydrogen, still flying out at thousands of kilometres a second. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
tarantula-nebula:
  desc: "30 Doradus in the Large Magellanic Cloud, about 162,000 light years away and more than 1,800 light years across, the largest and brightest star-forming region in the Local Group. If it were as close as the Orion Nebula it would cast shadows. At its heart is the cluster R136, home of the most massive star known, R136a1, about 200 times the Sun's mass. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
thors-helmet:
  desc: "NGC 2359 in Canis Major, about 12,000–16,000 light years away (Gaia's latest gives about 15,700) and some 30–40 light years across: a bubble blown by the fierce wind of WR 7, a Wolf-Rayet star, a massive star near its end. The bubble glows teal from oxygen, with red wings either side like a helmet's. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
iris-nebula:
  desc: "NGC 7023 in Cepheus, about 1,100–1,300 light years away and some 6 light years across: dust reflecting the light of the massive star HD 200775 in its middle, blue and petal-like, with faint red threads near the star, set inside a larger dark cloud. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
flame-nebula:
  desc: "NGC 2024 in Orion, beside Alnitak and near the Horsehead, about 1,350 light years away and some 12 light years across: gas lit by a young cluster hidden behind dust, orange-yellow because the dust filters out the blue, with a dark trunk of dust and its branches across the front. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. The colours are those each gas really gives off, but where they fall, how bright they are and the dust lanes are drawn by hand after photographs."
pillars-of-creation:
  desc: "Three columns of dust in the Eagle Nebula (M16), about 5,700 light years away, the tallest some 3.5–4 light years long, pictured by Hubble in 1995 and again by Webb in 2022. Light and wind from the cluster NGC 6611 to the north-west are eating them away, so their tips point at it and glow. Stars are forming inside them. The 3D shape is a model, since we only ever see it from one side. Its position, distance and size follow what has been measured; which way it faces on the sky is approximate. It can be shown two ways, in rough colours to the eye or in the colours of Webb's infrared picture; both are models drawn by hand."
milky-way:
  desc: The barred spiral galaxy the Solar System is in, with some 100–400 billion stars. The disk is about 100,000 light years across but only about a thousand thick. The Sun is some 26,700 light years from the centre, in the Orion Arm, and goes round it once every 230 million years or so, only about 20 times since it formed. The pale band across the night sky is this disk seen from inside.
sgr-a:
  desc: The supermassive black hole at the centre of the Galaxy, about 4.3 million times the Sun's mass and 26,700 light years away towards Sagittarius. Dust hides it completely in visible light. Astronomers proved it is there from the orbits of the S-stars around it (the 2020 Nobel Prize in Physics). S2 goes round every 16 years and swings within about 120 AU at nearly 3% of the speed of light. The named S-stars follow their measured orbits. The tens of thousands of stars around them are a model of the nuclear star cluster, as dense as measured and on circular orbits at the speed the black hole's mass sets, but no one of them is in its real place. The blue ones are young stars that share one disk, tilted as measured. Further out is the bulge, a bar about 1.5 kpc long placed at its measured shape and angle, but drawn about 5 times brighter than it is, or from the Solar System it would barely show. Between us and every one of these stars is a modelled layer of dust along the Galactic plane, which dims and reddens the stars it hides, so from the Solar System a dark lane runs through the middle with the bulge glowing either side, as in photographs. How thick the dust is follows measured values roughly; the shapes of its clouds are random, not a map of the real dust, so they will not match the lanes in photographs such as the Great Rift. The centre has its own time control at the bottom; try 1 year a second. The Event Horizon Telescope imaged the ring around its shadow in 2022; it is about 0.4 AU across, smaller than Mercury's orbit.
lmc:
  desc: The largest satellite galaxy of the Milky Way, about 163,000 light years away, a naked-eye smudge in the southern sky. Supernova 1987A, the brightest of modern times, went off in it.
smc:
  desc: A dwarf satellite galaxy of the Milky Way, about 200,000 light years away, pulled out of shape by the gravity of the Milky Way and the Large Magellanic Cloud.
andromeda:
  desc: The largest spiral in the Local Group, about 2.5 million light years away and the farthest thing easily seen with the naked eye, an oval smudge in Andromeda. It has around a trillion stars, several times the Milky Way's, and it is heading toward us. The light you see tonight left it before there were humans.
triangulum:
  desc: The third-largest spiral in the Local Group after Andromeda and the Milky Way, about 2.7 million light years away and probably a satellite of Andromeda. Its loose arms are full of pink star-forming regions. Under a truly dark sky some people can see it with the naked eye.
galaxy-field:
  desc: About 55,000 galaxies with measured distances from the Cosmicflows-4 catalogue (Tully et al. 2023), out to some 2.6 billion light years, and some 31,000 more from the 2MASS Redshift Survey (Huchra et al. 2012), which has every galaxy bright enough over almost the whole sky within about a billion light years, some 99,000 from the 6dF Galaxy Survey (Jones et al. 2009), which fills in the southern sky out to about 2.5 billion, and some 2.4 million from the Sloan Digital Sky Survey, out to about 8.5 billion light years, and 2.4 million galaxies and quasars from DESI (the Dark Energy Spectroscopic Instrument), out to about 20 billion, and some 1.2 million quasars over the whole sky from Quaia (Storey-Fisher et al. 2024). Each point is a whole galaxy of billions of stars. Galaxies are not spread evenly but gather into clusters, sheets and filaments hundreds of millions of light years long, with great voids between. The Milky Way sits on the outskirts of the Virgo Supercluster.
bootes-void:
  desc: A region almost empty of galaxies, about 330 million light years across and some 700 million light years away toward Boötes. Found in 1981 and often called the Great Void, it is one of the largest known. Had the Milky Way sat at its centre, we would not have known other galaxies existed until the 1960s. Most of the universe is voids like this, between walls and filaments of galaxies.
cmb:
  desc: "The oldest light there is to see. It set out when the universe was about 380,000 years old and had cooled enough to let light through for the first time, and has travelled some 13.8 billion years since, stretched into microwaves as the universe grew. The place it left is now about 41 billion light years away The figure usually quoted is 46 billion. The difference is the expansion rate, the Hubble constant H0: every galaxy here is placed with H0 = 75 km/s/Mpc, while the 46 billion uses Planck's 67.7. Nearby galaxies give about 73 and Planck about 67 to 68, and why the two methods disagree is still unexplained. So everything this far out is about 10% closer than Planck's numbers would put it, all together, and the sphere sits where it should relative to the galaxies. Before that the universe was a hot opaque gas, so there is no seeing past it: this sphere is the edge of the observable universe. The map is from the Planck satellite (2018). Red is warmer than average and blue cooler, by only about a part in 100,000 of 2.7 kelvin. Those small differences are the seeds that grew into galaxies and the cosmic web. Between the farthest galaxies here and this sphere is what has not been mapped yet, not empty space. The band along the Milky Way is filled in by estimate, where our Galaxy's dust is in the way."
