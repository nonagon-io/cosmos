# Regions are drawn from the small-body data (belts) or as models (heliosphere, Oort cloud).
# `inner`/`outer` are distances from the Sun in AU, `view` the camera distance to show the whole region.
- id: asteroid-belt
  name: แถบดาวเคราะห์น้อย
  en: Asteroid belt
  inner: 2.1
  outer: 3.3
  view: 9
  catalog: true
  desc: ดาวเคราะห์น้อยหลายล้านดวงระหว่างดาวอังคารกับดาวพฤหัสบดี มวลรวมกันแค่ราว 3% ของดวงจันทร์ ที่แสดงอยู่คือดวงที่มีขนาดใหญ่กว่าราว 5 กม. ตามวงโคจรจริงจากฐานข้อมูล JPL แต่ละจุดสว่างและใหญ่ตามขนาดของดาวดวงนั้น ดวงใหญ่อย่างซีรีสและเวสตาจึงเด่น ส่วนดวงเล็กหลายหมื่นดวงเป็นฝ้าจางๆ ความต่างนี้ถูกบีบลงมาก ของจริงสว่างต่างกันได้หลายหมื่นเท่า ถ้าเปิดขนาดจริง ดาวเคราะห์น้อยทุกดวงเล็กเกินกว่าจะเห็น ฝ้าที่เหลือแค่บอกว่าพวกมันอยู่ตรงไหน และจางหายไปเมื่อซูมออกเลยดาวพฤหัสบดี ช่องว่างเคิร์กวูดเกิดจากแรงสั่นพ้องกับดาวพฤหัสบดี

- id: trojans
