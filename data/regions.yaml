  desc: เนบิวลา NGC 7000 และเนบิวลานกกระทุง (IC 5070) ในกลุ่มดาวหงส์ ใกล้ดาวเดเนบ ห่างราว 2,600 ปีแสง กว้างรวมราว 130 ปีแสง ที่จริงเป็นก๊าซเรืองแสงก้อนเดียวกัน แต่มีเมฆฝุ่นมืด L935 อยู่ข้างหน้าบังตรงกลาง จึงเห็นเป็นรูปทวีปอเมริกาเหนือกับนกกระทุงแยกกัน ขอบด้านใต้ที่สว่างเรียกว่ากำแพงหงส์ (Cygnus Wall) รูปทรงสามมิติที่เห็นเป็นแบบจำลอง เพราะเราเห็นเนบิวลาจากด้านเดียว ตำแหน่ง ระยะ และขนาดอิงค่าที่วัดได้จริง ส่วนทิศที่หันบนฟ้าเป็นค่าประมาณ สีเป็นสีของแสงที่แก๊สแต่ละชนิดเปล่งออกมาจริง แต่สีไหนอยู่ตรงไหน สว่างแค่ไหน รวมถึงแถบฝุ่น วาดด้วยมือเลียนแบบภาพถ่าย สีในแอปออกแดงอมส้มมากกว่าเนบิวลาเปล่งแสงส่วนใหญ่ที่ออกชมพู เพราะมีฝุ่นบังอยู่ด้านหน้า วัดได้สูงสุดราว 3 แมกนิจูดในแสงที่ตาเห็น (Laugalys และ Straižys) ฝุ่นขนาดนั้นทำให้แสงสีฟ้าของไฮโดรเจน (Hβ) เหลือราวครึ่งเดียวเมื่อเทียบกับแสงสีแดง (Hα) ส่วนเฉดสีที่เลือกเป็นค่าประมาณจากตัวเลขนี้ ภาพในแอปสว่างและสีจัดแบบภาพถ่ายเปิดรับแสงนาน ในที่มืดมากตาเปล่าเห็นเป็นส่วนที่สว่างกว่าของทางช้างเผือกข้างดาวเดเนบ ไม่ใช่สีแดง

