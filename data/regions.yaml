  en: Heliosphere
  inner: 94
  outer: 121
  view: 420
  desc: ฟองลมสุริยะที่ห่อหุ้มระบบสุริยะ วอยเอเจอร์ 1 ข้ามคลื่นกระแทกปลายทาง (termination shock) ที่ 94 AU ในปี 2004 และเฮลิโอพอสที่ 121 AU ในปี 2012 ตรงนั้นลมสุริยะหยุดและเริ่มเป็นอวกาศระหว่างดาว รูปร่างจริงยืดออกไปทางท้ายคล้ายดาวหาง ที่วาดนี้เป็นทรงกลมโดยประมาณ

- id: oort-cloud
  name: เมฆออร์ต
  en: Oort cloud
  inner: 2000
  outer: 100000
  view: 300000
  model: true
  desc: เปลือกทรงกลมของวัตถุน้ำแข็งนับล้านล้านชิ้น ต้นทางของดาวหางคาบยาว ยังไม่เคยมีใครสังเกตวัตถุในเมฆออร์ตได้โดยตรง สิ่งที่วาดอยู่จึงเป็นแบบจำลองตามทฤษฎี ความสว่างของแต่ละจุดสุ่มจากการกระจายขนาดของนิวเคลียสดาวหางที่วัดได้ ชิ้นใหญ่ไม่กี่ชิ้นจึงเด่นและชิ้นเล็กจำนวนมากเป็นฝ้า แต่จุดที่เด่นก็ไม่ใช่วัตถุที่รู้จักจริง ถ้าเปิดขนาดจริง ทุกชิ้นเล็กเกินกว่าจะเห็น ฝ้าที่เหลือแค่บอกรูปทรง เมื่อซูมออก ชั้นในจะสว่างที่สุดที่ราว 11,000 AU ชั้นนอกที่ราว 4 ปีแสง จากนั้นค่อยๆ จางหาย เพราะจากไกลขนาดนั้นไม่มีทางเห็นได้ ส่วนในเป็นรูปจานหนาราว 2,000–20,000 AU ส่วนนอกเป็นทรงกลมไปถึงราว 100,000 AU หรือ 1.6 ปีแสง ซึ่งเกือบครึ่งทางไปดาวฤกษ์ดวงอื่น ถ้ายานวอยเอเจอร์ 1 เดินทางต่อไปก็ต้องใช้เวลาราว 300 ปีกว่าจะถึงขอบด้านใน

# Out among the stars. `at` places a cluster or nebula by RA/Dec (degrees) and distance (light years);
# `view` is still the camera distance in AU.
