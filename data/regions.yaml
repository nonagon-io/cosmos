  desc: กาแล็กซีกังหันใหญ่อันดับสามของกลุ่มกาแล็กซีท้องถิ่น รองจากแอนดรอเมดาและทางช้างเผือก ห่างราว 2.7 ล้านปีแสง น่าจะเป็นบริวารของแอนดรอเมดา แขนกังหันหลวมๆ เต็มไปด้วยแหล่งก่อตัวดาวสีชมพู บนฟ้ามืดสนิทบางคนมองเห็นได้ด้วยตาเปล่า

- id: galaxy-field
  name: กาแล็กซีที่วัดระยะได้
  en: Galaxies with measured distances
  inner: 2210000000000
  outer: 1310000000000000
  view: 120000000000000
  galaxies: true
  desc: กาแล็กซีราว 55,000 แห่งที่วัดระยะได้จากแค็ตตาล็อก Cosmicflows-4 (Tully และคณะ 2023) ไกลสุดราว 2,600 ล้านปีแสง กับอีกราว 31,000 แห่งจากการสำรวจ 2MRS (Huchra และคณะ 2012) ซึ่งเก็บกาแล็กซีที่สว่างพอได้ครบเกือบทั้งท้องฟ้าในรัศมีราว 1,000 ล้านปีแสง อีกราว 99,000 แห่งจากการสำรวจ 6dFGS (Jones และคณะ 2009) ซึ่งเติมท้องฟ้าซีกใต้ไกลถึงราว 2,500 ล้านปีแสง และอีกราว 2.4 ล้านแห่งจาก SDSS (Sloan Digital Sky Survey) ไกลสุดราว 8,500 ล้านปีแสง และกาแล็กซีกับเควซาร์อีก 2.4 ล้านแห่งจาก DESI (Dark Energy Spectroscopic Instrument) ไกลสุดราว 20,000 ล้านปีแสง และเควซาร์อีกราว 1.2 ล้านแห่งทั่วทั้งท้องฟ้าจาก Quaia (Storey-Fisher และคณะ 2024) แต่ละจุดคือกาแล็กซีหนึ่งแห่งที่มีดาวหลายพันล้านดวง กาแล็กซีไม่ได้กระจายสม่ำเสมอ แต่จับกลุ่มเป็นกระจุก แผ่น และเส้นใยยาวหลายร้อยล้านปีแสง โดยมีที่ว่างใหญ่คั่นอยู่ ทางช้างเผือกอยู่ชายขอบของซูเปอร์คลัสเตอร์หญิงสาว

- id: bootes-void
  name: ช่องว่างคนเลี้ยงสัตว์ (Boötes Void)
  en: Boötes Void
  at: { type: void, ra: 218, dec: 46, ly: 670000000, radius: 165000000 }
  view: 25000000000000
  desc: บริเวณที่แทบไม่มีกาแล็กซีกว้างราว 330 ล้านปีแสง ห่างจากเราราว 700 ล้านปีแสงในทิศกลุ่มดาวคนเลี้ยงสัตว์ ค้นพบในปี 1981 และมักถูกเรียกว่า The Great Void เป็นหนึ่งในช่องว่างใหญ่ที่สุดที่รู้จัก ถ้าทางช้างเผือกอยู่ใจกลางมัน เราคงไม่รู้ว่ามีกาแล็กซีอื่นจนถึงยุค 1960 จักรวาลส่วนใหญ่เป็นช่องว่างแบบนี้ คั่นด้วยผนังและเส้นใยของกาแล็กซี

- id: cmb
  name: รังสีไมโครเวฟพื้นหลัง
  en: Cosmic microwave background
  inner: 2620000000000000
  outer: 2620000000000000
  view: 7500000000000000
  desc: แสงที่เก่าที่สุดที่มองเห็นได้ ออกเดินทางตอนเอกภพอายุราว 380,000 ปี เมื่อเอกภพเย็นลงจนแสงผ่านได้เป็นครั้งแรก เดินทางมาราว 13,800 ล้านปี ระหว่างทางเอกภพขยายจนแสงยืดเป็นคลื่นไมโครเวฟ และที่ที่แสงออกมานั้นตอนนี้อยู่ห่างราว 41,000 ล้านปีแสง ตัวเลขที่มักได้ยินคือ 46,000 ล้านปีแสง ที่ต่างกันเพราะระยะขึ้นกับว่าเอกภพขยายตัวเร็วแค่ไหน (ค่าคงที่ฮับเบิล H0) ฉากนี้วางกาแล็กซีทั้งหมดด้วย H0 = 75 กม./วิ/เมกะพาร์เซก ส่วนตัวเลข 46,000 ใช้ค่าของ Planck ราว 67.7 ค่าที่วัดจากกาแล็กซีใกล้ๆ ได้ราว 73 ส่วนค่าจาก Planck ได้ราว 67–68 และยังหาคำอธิบายไม่ได้ว่าทำไมสองวิธีไม่ตรงกัน ระยะทุกอย่างในฉากที่ไกลระดับนี้จึงสั้นกว่าตัวเลขของ Planck ราว 10% ทั้งชุด ทรงกลมนี้จึงอยู่ที่เดิมเมื่อเทียบกับกาแล็กซี ก่อนหน้านั้นเอกภพเป็นก๊าซร้อนทึบแสง จึงมองทะลุไปไม่ได้ ทรงกลมนี้จึงเป็นขอบของสิ่งที่สังเกตได้ แผนที่มาจากดาวเทียม Planck (2018) สีแดงคือส่วนที่อุ่นกว่าเฉลี่ย สีน้ำเงินคือส่วนที่เย็นกว่า ต่างกันแค่ราวหนึ่งในแสนของอุณหภูมิ 2.7 เคลวิน ความต่างเล็กๆ นี้คือเมล็ดพันธุ์ที่ต่อมาโตเป็นกาแล็กซีและโครงข่ายใยจักรวาล ระหว่างกาแล็กซีที่ไกลที่สุดในฉากกับทรงกลมนี้เป็นส่วนที่ยังไม่มีแผนที่ ไม่ใช่ที่ว่าง แถบตามระนาบทางช้างเผือกถูกเติมด้วยการประมาณ เพราะฝุ่นในกาแล็กซีเราบังไว้
