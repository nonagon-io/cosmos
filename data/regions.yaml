- id: milky-way
  name: ทางช้างเผือก
  en: Milky Way
  at: { type: galaxy, ra: 266.41683, dec: -29.00781, ly: 26670, radius: 50000, home: true }
  view: 12000000000
  desc: กาแล็กซีกังหันมีคานที่ระบบสุริยะอยู่ มีดาวราว 1–4 แสนล้านดวง จานกว้างราว 100,000 ปีแสงแต่หนาแค่ราวพันปีแสง ดวงอาทิตย์อยู่ห่างใจกลางราว 26,700 ปีแสงบนแขนนายพราน และโคจรรอบใจกลางรอบละราว 230 ล้านปี ตั้งแต่เกิดมาโคจรไปได้แค่ราว 20 รอบ แถบฝ้าขาวพาดฟ้าที่เราเห็นตอนกลางคืนคือจานนี้เมื่อมองจากข้างใน

- id: sgr-a
  name: ใจกลางทางช้างเผือก (Sgr A*)
  en: Galactic centre (Sgr A*)
  at: { type: blackhole, ra: 266.41683, dec: -29.00781, ly: 26670, radius: 0.0000033 }
  view: 9
  desc: หลุมดำมวลยวดยิ่งที่ใจกลางกาแล็กซี มวลราว 4.3 ล้านเท่าดวงอาทิตย์ ห่างราว 26,700 ปีแสงในทิศกลุ่มดาวคนยิงธนู มองด้วยแสงที่ตาเห็นไม่ได้เพราะฝุ่นบังหมด นักดาราศาสตร์พิสูจน์ว่ามันมีอยู่จากวงโคจรของดาว S ที่วิ่งรอบมัน (รางวัลโนเบลฟิสิกส์ 2020) ดาว S2 โคจรรอบละ 16 ปี และเฉียดเข้าไปใกล้ราว 120 AU ด้วยความเร็วเกือบ 3% ของความเร็วแสง ดาว S ที่มีชื่อกำกับเดินตามวงโคจรที่วัดได้จริง ส่วนดาวอีกหลายหมื่นดวงรอบๆ เป็นแบบจำลองของกระจุกดาวใจกลาง วางให้หนาแน่นตามที่วัดได้และโคจรเป็นวงกลมด้วยความเร็วที่มวลหลุมดำกำหนด แต่ไม่ใช่ตำแหน่งจริงของดาวแต่ละดวง ดาวสีฟ้าคือดาวอายุน้อยที่โคจรอยู่ในจานเดียวกัน เอียงตามที่วัดได้ ไกลออกไปเป็นป่องดาวรูปคานยาวราว 1.5 กิโลพาร์เซก วางตามรูปทรงและมุมที่วัดได้ แต่ทำให้สว่างกว่าจริงราว 5 เท่า ไม่งั้นมองจากระบบสุริยะแทบไม่เห็น ระหว่างเรากับดาวทุกดวงมีชั้นฝุ่นจำลองตามระนาบกาแล็กซี ดาวที่แสงต้องผ่านฝุ่นมากจะจางลงและแดงขึ้น มองจากระบบสุริยะจึงเห็นแถบฝุ่นมืดพาดกลาง และป่องดาวเรืองอยู่สองข้างเหมือนในภาพถ่าย ความหนาของฝุ่นอิงค่าที่วัดได้โดยประมาณ แต่รูปร่างกลุ่มฝุ่นเป็นลายสุ่ม ไม่ใช่แผนที่ฝุ่นจริง จึงไม่ตรงกับแนวฝุ่นที่เห็นในภาพถ่าย เช่น Great Rift แสงจากสิ่งที่อยู่ด้านหลังหลุมดำก็โค้งรอบมันด้วย เข้าไปใกล้จะเห็นดาวยืดเป็นเส้นโค้งล้อมเงา บางดวงเห็นสองภาพคนละฝั่ง การโค้งคำนวณจริง แต่ทำโดยวาดภาพบนจอใหม่ตามทางที่แสงโค้ง จึงแสดงได้เฉพาะสิ่งที่อยู่ในจอ ดาวและวงโคจรรอบหลุมดำถูกแบ่งตรงหลุมดำ ส่วนที่อยู่ด้านหลังถูกโค้ง ส่วนที่อยู่ด้านหน้าไม่ถูกโค้ง แต่ดาวไกลออกไปในทางช้างเผือกที่อยู่ระหว่างเรากับหลุมดำยังถูกโค้งไปด้วยทั้งที่จริงไม่ควร และจะเห็นผลนี้เฉพาะตอนหลุมดำไม่ได้ถูกขยายให้มองเห็นจากไกล ตรงนี้มีปุ่มเวลาของตัวเองด้านล่าง ลองเร่งเป็น 1 ปีต่อวินาทีดู กล้อง Event Horizon Telescope ถ่ายภาพวงแหวนรอบเงาของมันได้ในปี 2022 วงแหวนกว้างราว 0.4 AU เล็กกว่าวงโคจรดาวพุธ

