- id: andromeda
  name: กาแล็กซีแอนดรอเมดา (M31)
  en: Andromeda Galaxy (M31)
  at: { type: galaxy, ra: 10.68471, dec: 41.26875, ly: 2550000, radius: 76000 }
  view: 14000000000
  desc: กาแล็กซีกังหันขนาดใหญ่ที่สุดในกลุ่มกาแล็กซีท้องถิ่น ห่างราว 2.5 ล้านปีแสง เป็นสิ่งที่ไกลที่สุดที่มองเห็นด้วยตาเปล่าได้ง่าย เป็นฝ้ารีๆ ในกลุ่มดาวแอนดรอเมดา มีดาวราวหนึ่งล้านล้านดวง มากกว่าทางช้างเผือกหลายเท่า และกำลังพุ่งเข้าหาเรา แสงที่เห็นคืนนี้ออกจากมันตั้งแต่ก่อนมีมนุษย์

- id: triangulum
  name: กาแล็กซีสามเหลี่ยม (M33)
  en: Triangulum Galaxy (M33)
  at: { type: galaxy, ra: 23.46208, dec: 30.66017, ly: 2640000, radius: 30000 }
  view: 6000000000
  desc: กาแล็กซีกังหันใหญ่อันดับสามของกลุ่มกาแล็กซีท้องถิ่น รองจากแอนดรอเมดาและทางช้างเผือก ห่างราว 2.7 ล้านปีแสง น่าจะเป็นบริวารของแอนดรอเมดา แขนกังหันหลวมๆ เต็มไปด้วยแหล่งก่อตัวดาวสีชมพู บนฟ้ามืดสนิทบางคนมองเห็นได้ด้วยตาเปล่า

- id: galaxy-field
  name: กาแล็กซีที่วัดระยะได้
  en: Galaxies with measured distances
  inner: 2210000000000
  outer: 570000000000000
  view: 120000000000000
  galaxies: true
  desc: กาแล็กซีราว 55,000 แห่งที่วัดระยะได้จากแค็ตตาล็อก Cosmicflows-4 (Tully และคณะ 2023) ไกลสุดราว 2,600 ล้านปีแสง กับอีกราว 31,000 แห่งจากการสำรวจ 2MRS (Huchra และคณะ 2012) ซึ่งเก็บกาแล็กซีที่สว่างพอได้ครบเกือบทั้งท้องฟ้าในรัศมีราว 1,000 ล้านปีแสง และอีกราว 2.4 ล้านแห่งจาก SDSS (Sloan Digital Sky Survey) ไกลสุดราว 8,500 ล้านปีแสง แต่ละจุดคือกาแล็กซีหนึ่งแห่งที่มีดาวหลายพันล้านดวง กาแล็กซีไม่ได้กระจายสม่ำเสมอ แต่จับกลุ่มเป็นกระจุก แผ่น และเส้นใยยาวหลายร้อยล้านปีแสง โดยมีที่ว่างใหญ่คั่นอยู่ ทางช้างเผือกอยู่ชายขอบของซูเปอร์คลัสเตอร์หญิงสาว

- id: bootes-void
  name: ช่องว่างคนเลี้ยงสัตว์ (Boötes Void)
  en: Boötes Void
  at: { type: void, ra: 218, dec: 46, ly: 670000000, radius: 165000000 }
  view: 25000000000000
  desc: บริเวณที่แทบไม่มีกาแล็กซีกว้างราว 330 ล้านปีแสง ห่างจากเราราว 700 ล้านปีแสงในทิศกลุ่มดาวคนเลี้ยงสัตว์ ค้นพบในปี 1981 และมักถูกเรียกว่า The Great Void เป็นหนึ่งในช่องว่างใหญ่ที่สุดที่รู้จัก ถ้าทางช้างเผือกอยู่ใจกลางมัน เราคงไม่รู้ว่ามีกาแล็กซีอื่นจนถึงยุค 1960 จักรวาลส่วนใหญ่เป็นช่องว่างแบบนี้ คั่นด้วยผนังและเส้นใยของกาแล็กซี
