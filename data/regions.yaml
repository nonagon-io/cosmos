# Regions are drawn from the small-body data (belts) or as models (heliosphere, Oort cloud).
# `inner`/`outer` are distances from the Sun in AU, `view` the camera distance to show the whole region.
- id: asteroid-belt
  name: แถบดาวเคราะห์น้อย
  en: Asteroid belt
  inner: 2.1
  outer: 3.3
  view: 9
  catalog: true
  desc: ดาวเคราะห์น้อยหลายล้านดวงระหว่างดาวอังคารกับดาวพฤหัสบดี มวลรวมกันแค่ราว 3% ของดวงจันทร์ ที่แสดงอยู่คือดวงที่มีขนาดใหญ่กว่าราว 5 กม. ตามวงโคจรจริงจากฐานข้อมูล JPL ช่องว่างเคิร์กวูดเกิดจากแรงสั่นพ้องกับดาวพฤหัสบดี

- id: trojans
  name: ดาวเคราะห์น้อยทรอย
  en: Jupiter trojans
  inner: 4.9
  outer: 5.5
  view: 16
  catalog: true
  desc: สองกลุ่มที่โคจรนำหน้าและตามหลังดาวพฤหัสบดี 60° ที่จุดลากรานจ์ L4 และ L5 ยานลูซีกำลังเดินทางไปสำรวจ

- id: kuiper-belt
  name: แถบไคเปอร์
  en: Kuiper belt
  inner: 30
  outer: 55
  view: 160
  catalog: true
  desc: แถบวัตถุน้ำแข็งพ้นวงโคจรดาวเนปจูน มีพลูโต เฮาเมอา และมาคีมาคี วัตถุกลุ่มใหญ่ที่ 39.4 AU โคจรสั่นพ้อง 2:3 กับดาวเนปจูนเหมือนพลูโต จุดทั้งหมดที่เห็นเป็นวัตถุที่ค้นพบแล้วจริง

- id: heliosphere
  name: เฮลิโอสเฟียร์
  en: Heliosphere
  inner: 94
  outer: 121
  view: 420
  desc: ฟองลมสุริยะที่ห่อหุ้มระบบสุริยะ วอยเอเจอร์ 1 ข้ามคลื่นกระแทกปลายทาง (termination shock) ที่ 94 AU ในปี 2004 และเฮลิโอพอสที่ 121 AU ในปี 2012 ตรงนั้นลมสุริยะหยุดและเริ่มเป็นอวกาศระหว่างดาว รูปร่างจริงยืดออกไปทางท้ายคล้ายดาวหาง ที่วาดนี้เป็นทรงกลมโดยประมาณ

- id: oort-cloud
  name: เมฆออร์ต
  en: Oort cloud
  inner: 2000
  outer: 100000
  view: 300000
  model: true
  desc: เปลือกทรงกลมของวัตถุน้ำแข็งนับล้านล้านชิ้น ต้นทางของดาวหางคาบยาว ยังไม่เคยมีใครสังเกตวัตถุในเมฆออร์ตได้โดยตรง สิ่งที่วาดอยู่จึงเป็นแบบจำลองตามทฤษฎี ส่วนในเป็นรูปจานหนาราว 2,000–20,000 AU ส่วนนอกเป็นทรงกลมไปถึงราว 100,000 AU หรือ 1.6 ปีแสง ซึ่งเกือบครึ่งทางไปดาวฤกษ์ดวงอื่น ถ้ายานวอยเอเจอร์ 1 เดินทางต่อไปก็ต้องใช้เวลาราว 300 ปีกว่าจะถึงขอบด้านใน

# Out among the stars. `at` places a cluster or nebula by RA/Dec (degrees) and distance (light years);
# `view` is still the camera distance in AU.
- id: star-field
  name: ดาวฤกษ์รอบดวงอาทิตย์
  en: Stars around the Sun
  inner: 268000
  outer: 190000000
  view: 60000000
  stars: true
  desc: ดาวราว 108,000 ดวงที่วัดระยะได้ภายในราว 3,000 ปีแสง วางตามตำแหน่งจริงทั้งหมด จากในระบบสุริยะดาวเหล่านี้คือท้องฟ้ากลางคืนที่เราเห็น พอบินออกมาจะเห็นว่ากลุ่มดาวที่ดูอยู่ใกล้กันบนท้องฟ้าจริงๆ แล้วอยู่ห่างกันคนละระยะ ทั้งหมดนี้เป็นแค่มุมเล็กๆ ของทางช้างเผือกที่กว้างราว 100,000 ปีแสง

- id: hyades
  name: กระจุกดาวไฮยาดีส
  en: Hyades
  at: { type: cluster, ra: 66.75, dec: 15.87, ly: 153, radius: 9 }
  view: 4400000
  desc: กระจุกดาวเปิดที่ใกล้โลกที่สุด ห่างราว 153 ปีแสง เป็นรูปตัว V ที่หัวของกลุ่มดาววัว อายุราว 600–700 ล้านปี ดาวอัลเดบารันที่ดูเหมือนอยู่กลางกระจุกจริงๆ อยู่ใกล้กว่ามาก (65 ปีแสง) แค่บังเอิญอยู่ในทิศเดียวกัน ลองบินไปดูจากด้านข้างจะเห็นชัด

- id: coma-cluster
  name: กระจุกดาวผมเบเรนิซ
  en: Coma Star Cluster
  at: { type: cluster, ra: 186.0, dec: 26.0, ly: 280, radius: 7 }
  view: 3800000
  desc: กระจุกดาวเปิด Melotte 111 ในกลุ่มดาวผมเบเรนิซ ห่างราว 280 ปีแสง ใกล้เป็นอันดับสองรองจากไฮยาดีส มองด้วยตาเปล่าเป็นกลุ่มดาวจางๆ กว้างหลายองศา

- id: pleiades
  name: กระจุกดาวลูกไก่
  en: Pleiades
  at: { type: cluster, ra: 56.75, dec: 24.12, ly: 444, radius: 6, glow: '#9fbaff' }
  view: 3200000
  desc: กระจุกดาวเปิด M45 ห่างราว 444 ปีแสง อายุราว 100 ล้านปี ซึ่งยังเด็กมากเทียบกับดวงอาทิตย์ (4,600 ล้านปี) เห็นด้วยตาเปล่าราว 6–7 ดวง แต่มีสมาชิกกว่าพันดวง ฝ้าสีฟ้ารอบๆ เป็นฝุ่นที่สะท้อนแสงดาว ซึ่งกระจุกบังเอิญเคลื่อนผ่าน ไม่ใช่ซากเมฆที่ให้กำเนิดมัน

- id: ic2391
  name: กระจุกดาวโอไมครอนเวลอรัม
  en: Omicron Velorum Cluster
  at: { type: cluster, ra: 130.1, dec: -53.0, ly: 490, radius: 3 }
  view: 1900000
  desc: กระจุกดาวเปิด IC 2391 ในซีกฟ้าใต้ ห่างราว 490 ปีแสง อายุราว 50 ล้านปี เห็นด้วยตาเปล่าได้จากประเทศไทยตอนดึกช่วงต้นปี ต่ำทางทิศใต้

- id: alpha-persei
  name: กระจุกดาวแอลฟาเพอร์ซิอัส
  en: Alpha Persei Cluster
  at: { type: cluster, ra: 51.7, dec: 49.0, ly: 570, radius: 10 }
  view: 5000000
  desc: กระจุกดาวเปิด Melotte 20 รอบดาวมีร์ฟักในกลุ่มดาวเปอร์ซิอัส ห่างราว 570 ปีแสง อายุราว 50–70 ล้านปี

- id: praesepe
  name: กระจุกดาวรังผึ้ง
  en: Beehive Cluster
  at: { type: cluster, ra: 130.1, dec: 19.67, ly: 577, radius: 6 }
  view: 3200000
  desc: กระจุกดาวเปิด M44 (Praesepe) ในกลุ่มดาวปู ห่างราว 577 ปีแสง อายุราว 600–700 ล้านปี ใกล้เคียงกับไฮยาดีสและเคลื่อนที่ไปทางเดียวกัน จึงอาจเกิดจากเมฆก้อนเดียวกัน กาลิเลโอเป็นคนแรกที่ส่องกล้องเห็นว่ามันเป็นดาวหลายสิบดวง

- id: helix-nebula
  name: เนบิวลาเกลียว
  en: Helix Nebula
  at: { type: nebula, ra: 337.41, dec: -20.84, ly: 650, radius: 1.4, glow: '#8fd6e8' }
  view: 950000
  desc: เนบิวลาดาวเคราะห์ NGC 7293 หนึ่งในที่ใกล้โลกที่สุด ห่างราว 650 ปีแสง เป็นเปลือกก๊าซที่ดาวคล้ายดวงอาทิตย์พ่นออกมาตอนใกล้สิ้นอายุ เหลือแกนกลางเป็นดาวแคระขาว ดวงอาทิตย์เองก็จะเป็นแบบนี้ในอีกราว 5 พันล้านปี

- id: orion-nebula
  name: เนบิวลานายพราน
  en: Orion Nebula
  at: { type: nebula, ra: 83.82, dec: -5.39, ly: 1344, radius: 12, glow: '#ff8fb8' }
  view: 6300000
  desc: แหล่งกำเนิดดาวที่ใกล้โลกที่สุดที่มีดาวมวลมาก ห่างราว 1,344 ปีแสง เห็นด้วยตาเปล่าเป็นดาวฝ้าๆ ตรงดาบของนายพราน ก๊าซเรืองแสงเพราะได้รับแสงจากดาวร้อนจัดกลุ่มทราพีเซียมตรงกลาง ข้างในมีดาวเกิดใหม่และจานก่อกำเนิดดาวเคราะห์หลายร้อยแห่ง
