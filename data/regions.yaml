  desc: เสาฝุ่นสามต้นในเนบิวลานกอินทรี (M16) ห่างราว 5,700 ปีแสง ต้นที่สูงที่สุดยาวราว 3.5–4 ปีแสง ฮับเบิลถ่ายไว้ในปี 1995 และเว็บบ์ถ่ายอีกครั้งในปี 2022 แสงและลมจากกระจุกดาว NGC 6611 ทางตะวันตกเฉียงเหนือกัดกร่อนเสา ปลายเสาจึงชี้เข้าหาดาวและเรืองแสง ข้างในเสามีดาวกำลังเกิด รูปทรงสามมิติที่เห็นเป็นแบบจำลอง เพราะเราเห็นเนบิวลาจากด้านเดียว ตำแหน่ง ระยะ และขนาดอิงค่าที่วัดได้จริง ส่วนทิศที่หันบนฟ้าเป็นค่าประมาณ ดูได้สองแบบ คือสีตามภาพของฮับเบิล กับสีตามภาพอินฟราเรดของกล้องเว็บบ์ ซึ่งไม่ใช่สีจริงทั้งคู่ ทั้งสองแบบเป็นแบบจำลองที่วาดด้วยมือ ภาพในแอปสว่างและสีจัดแบบภาพถ่ายเปิดรับแสงนาน ตาเปล่าไม่เห็น แม้ในกล้องโทรทรรศน์ก็แทบไม่เห็นเสา

