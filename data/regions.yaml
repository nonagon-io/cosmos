- id: kuiper-belt
  name: แถบไคเปอร์
  en: Kuiper belt
  inner: 30
  outer: 55
  view: 160
  catalog: true
  desc: แถบวัตถุน้ำแข็งพ้นวงโคจรดาวเนปจูน มีพลูโต เฮาเมอา และมาคีมาคี วัตถุกลุ่มใหญ่ที่ 39.4 AU โคจรสั่นพ้อง 2:3 กับดาวเนปจูนเหมือนพลูโต จุดทั้งหมดที่เห็นเป็นวัตถุที่ค้นพบแล้วจริง

- id: heliosphere
