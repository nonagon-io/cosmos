# The Galaxy. Its centre and the Magellanic Clouds are placed by their measured RA/Dec and distance; the disk and
# arms around them are a model (src/scene/galaxy.ts).
- id: milky-way
  name: ทางช้างเผือก
  en: Milky Way
  at: { type: galaxy, ra: 266.41683, dec: -29.00781, ly: 26670, radius: 50000, home: true }
  view: 12000000000
  desc: กาแล็กซีกังหันมีคานที่ระบบสุริยะอยู่ มีดาวราว 1–4 แสนล้านดวง จานกว้างราว 100,000 ปีแสงแต่หนาแค่ราวพันปีแสง ดวงอาทิตย์อยู่ห่างใจกลางราว 26,700 ปีแสงบนแขนนายพราน และโคจรรอบใจกลางรอบละราว 230 ล้านปี ตั้งแต่เกิดมาโคจรไปได้แค่ราว 20 รอบ แถบฝ้าขาวพาดฟ้าที่เราเห็นตอนกลางคืนคือจานนี้เมื่อมองจากข้างใน

- id: sgr-a
  name: ใจกลางทางช้างเผือก (Sgr A*)
  en: Galactic centre (Sgr A*)
  at: { type: blackhole, ra: 266.41683, dec: -29.00781, ly: 26670, radius: 0.0000033 }
  view: 5000
  desc: หลุมดำมวลยวดยิ่งที่ใจกลางกาแล็กซี มวลราว 4.3 ล้านเท่าดวงอาทิตย์ ห่างราว 26,700 ปีแสงในทิศกลุ่มดาวคนยิงธนู มองด้วยแสงที่ตาเห็นไม่ได้เพราะฝุ่นบังหมด นักดาราศาสตร์พิสูจน์ว่ามันมีอยู่จากวงโคจรของดาว S ที่วิ่งรอบมัน (รางวัลโนเบลฟิสิกส์ 2020) ดาว S2 โคจรรอบละ 16 ปี และเฉียดเข้าไปใกล้ราว 120 AU ด้วยความเร็วเกือบ 3% ของความเร็วแสง ดาวทุกดวงที่เห็นตรงนี้เดินตามวงโคจรที่วัดได้จริง ลองเร่งเวลาดู กล้อง Event Horizon Telescope ถ่ายภาพวงแหวนรอบเงาของมันได้ในปี 2022 วงแหวนกว้างราว 0.4 AU เล็กกว่าวงโคจรดาวพุธ

