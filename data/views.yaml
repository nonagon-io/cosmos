# Zoom stops in the scale panel. `distance` is the camera distance in AU, `focus` the body it centres on.
# `relative` stops work on whatever body the camera is on, or Earth; their distance here is Earth's
# `ladder` sets which focus a stop belongs to: `solar` for anything in the Solar System, a region's id for the
# stops of that region alone, `region` for any other region without its own. Stops without one are shared,
# from the Galaxy out, and kept on whatever deep-sky object the camera is on.
- id: body
  name: วัตถุเต็มดวง
  focus: earth
  ladder: solar
  distance: 0.0002
  relative: body
- id: system
  name: วัตถุและบริวาร
  focus: earth
  ladder: solar
  distance: 0.012
  relative: system
