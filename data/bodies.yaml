- id: oumuamua
  name: โอมูอามูอา
  en: ʻOumuamua
  kind: interstellar
  orbit: named
  # Mashchenko (2019), MNRAS 489, 3003: the oblate model that best fits the light curve
  shape: { axes: [0.0575, 0.0555, 0.0095], tumble: 54.5 }
  rotation: 8.67
  color: '#c9a48f'
  desc: >-
    วัตถุจากระบบดาวอื่นชิ้นแรกที่มีคนพบ (19 ต.ค. 2017) ตอนพบมันผ่านจุดใกล้ดวงอาทิตย์ไปแล้วและกำลังออกจากระบบสุริยะ
    วงโคจรเป็นไฮเพอร์โบลา จึงผ่านมาครั้งเดียวแล้วไม่กลับมาอีก

    ไม่เคยมีกล้องไหนเห็นรูปร่างของมัน ทุกกล้องเห็นเป็นแค่จุดแสงจุดเดียว
    สิ่งที่วัดได้คือความสว่างที่ขึ้นลงราว 10 เท่าทุกไม่กี่ชั่วโมง แปลว่ามันหมุนควงไปมา (ไม่ได้หมุนรอบแกนเดียว)
    และด้านหนึ่งยาวกว่าอีกด้านหลายเท่า
    รูปร่างในแอปนี้เป็นภาพจำลองทรงจานแบนขนาดราว 115 × 111 × 19 เมตร
    ซึ่งงานวิเคราะห์ของ Mashchenko (2019) พบว่าเข้ากับข้อมูลความสว่างได้ดีที่สุด
    อีกแบบที่ยังเป็นไปได้คือทรงซิการ์ยาวราว 6 เท่าของความกว้าง ซึ่งเป็นแบบที่ใช้ในภาพวาดของศิลปินที่เห็นตามข่าว

    นอกจากนี้มันยังถูกผลักออกจากดวงอาทิตย์แรงกว่าที่แรงโน้มถ่วงอย่างเดียวจะอธิบายได้ โดยไม่มีหางหรือก๊าซให้เห็น
    สาเหตุของเรื่องนี้ยังไม่มีข้อสรุป

